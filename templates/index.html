<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quant_evo - 自主进化量化系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 28px;
            color: #00d4ff;
        }
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .status-idle { background: #4caf50; }
        .status-running { background: #ff9800; animation: pulse 1s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
        }
        .card h2 {
            font-size: 16px;
            color: #888;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }
        .metric:last-child { border-bottom: none; }
        .metric-label { color: #888; }
        .metric-value {
            font-size: 20px;
            font-weight: bold;
            color: #00d4ff;
        }
        .metric-value.good { color: #4caf50; }
        .metric-value.warning { color: #ff9800; }

        .stock-table {
            width: 100%;
            border-collapse: collapse;
        }
        .stock-table th, .stock-table td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        .stock-table th {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
        }
        .stock-table tr:hover { background: #1f2a47; }
        .signal { padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .signal-buy { background: #4caf50; }
        .signal-sell { background: #f44336; }
        .signal-hold { background: #ff9800; }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #00d4ff;
            color: #1a1a2e;
        }
        .btn-primary:hover { background: #00a8cc; }
        .btn-secondary {
            background: #333;
            color: #fff;
        }
        .btn-secondary:hover { background: #444; }

        .experiment-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .experiment-item {
            padding: 12px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .experiment-item:last-child { border-bottom: none; }
        .exp-round { color: #888; font-size: 12px; }
        .exp-score { font-size: 18px; font-weight: bold; }
        .exp-score.best { color: #4caf50; }

        .params-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .param-item {
            background: #1f2a47;
            padding: 15px;
            border-radius: 8px;
        }
        .param-name { color: #888; font-size: 12px; margin-bottom: 5px; }
        .param-value { font-size: 24px; font-weight: bold; color: #00d4ff; }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>quant_evo</h1>
            <span id="status-badge" class="status-badge status-idle">就绪</span>
        </header>

        <!-- 核心指标 -->
        <div class="grid">
            <div class="card">
                <h2>系统状态</h2>
                <div class="metric">
                    <span class="metric-label">当前轮次</span>
                    <span class="metric-value" id="current-round">0</span>
                </div>
                <div class="metric">
                    <span class="metric-label">最优评分</span>
                    <span class="metric-value good" id="best-score">0</span>
                </div>
                <div class="metric">
                    <span class="metric-label">股票数量</span>
                    <span class="metric-value" id="stock-count">0</span>
                </div>
                <div class="metric">
                    <span class="metric-label">数据范围</span>
                    <span class="metric-value" id="date-range">-</span>
                </div>
            </div>

            <div class="card">
                <h2>最优参数</h2>
                <div class="params-grid" id="best-params">
                    <div class="param-item">
                        <div class="param-name">入场评分</div>
                        <div class="param-value" id="param-min-score">-</div>
                    </div>
                    <div class="param-item">
                        <div class="param-name">调仓周期</div>
                        <div class="param-value" id="param-rebalance">-</div>
                    </div>
                    <div class="param-item">
                        <div class="param-name">最大持仓</div>
                        <div class="param-value" id="param-positions">-</div>
                    </div>
                    <div class="param-item">
                        <div class="param-name">止损比例</div>
                        <div class="param-value" id="param-stop">-</div>
                    </div>
                </div>
                <div class="actions">
                    <button class="btn btn-primary" onclick="startResearch()">启动研究</button>
                    <button class="btn btn-secondary" onclick="refreshData()">刷新</button>
                </div>
            </div>

            <div class="card">
                <h2>最佳回测结果</h2>
                <div class="metric">
                    <span class="metric-label">年化收益</span>
                    <span class="metric-value good" id="best-annual">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">夏普比率</span>
                    <span class="metric-value good" id="best-sharpe">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">最大回撤</span>
                    <span class="metric-value warning" id="best-drawdown">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">胜率</span>
                    <span class="metric-value" id="best-winrate">-</span>
                </div>
            </div>
        </div>

        <!-- 股票池 -->
        <div class="card" style="margin-bottom: 20px;">
            <h2>股票池 & 信号</h2>
            <table class="stock-table">
                <thead>
                    <tr>
                        <th>代码</th>
                        <th>名称</th>
                        <th>最新价</th>
                        <th>评分</th>
                        <th>信号</th>
                        <th>5日动量</th>
                        <th>RSI</th>
                    </tr>
                </thead>
                <tbody id="stock-list">
                    <tr><td colspan="7" style="text-align:center;">加载中...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- 实验历史 -->
        <div class="card">
            <h2>研究历史</h2>
            <div class="experiment-list" id="experiment-list">
                <div class="experiment-item">暂无数据</div>
            </div>
        </div>
    </div>

    <script>
        // 刷新数据
        function refreshData() {
            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('current-round').textContent = data.current_round;
                    document.getElementById('best-score').textContent = data.best_score.toFixed(1);
                    document.getElementById('stock-count').textContent = data.stock_count;
                    document.getElementById('date-range').textContent =
                        `${data.start_date} ~ ${data.end_date}`;

                    const badge = document.getElementById('status-badge');
                    if (data.status === 'running') {
                        badge.className = 'status-badge status-running';
                        badge.textContent = '运行中';
                    } else {
                        badge.className = 'status-badge status-idle';
                        badge.textContent = '就绪';
                    }
                });

            fetch('/api/research')
                .then(r => r.json())
                .then(data => {
                    // 更新参数
                    const params = data.best_params;
                    if (params) {
                        document.getElementById('param-min-score').textContent = params.min_score || '-';
                        document.getElementById('param-rebalance').textContent = (params.rebalance_days || '-') + '天';
                        document.getElementById('param-positions').textContent = params.max_positions || '-';
                        document.getElementById('param-stop').textContent = params.stop_loss_pct ? (params.stop_loss_pct * 100).toFixed(0) + '%' : '-';
                    }

                    // 更新最佳回测
                    const metrics = data.best_metrics;
                    if (metrics) {
                        document.getElementById('best-annual').textContent = (metrics.annual_return || 0).toFixed(1) + '%';
                        document.getElementById('best-sharpe').textContent = (metrics.sharpe_ratio || 0).toFixed(2);
                        document.getElementById('best-drawdown').textContent = (metrics.max_drawdown || 0).toFixed(1) + '%';
                        document.getElementById('best-winrate').textContent = (metrics.win_rate || 0).toFixed(0) + '%';
                    }

                    // 更新实验列表
                    const list = document.getElementById('experiment-list');
                    if (data.experiments && data.experiments.length > 0) {
                        list.innerHTML = data.experiments.map(exp => `
                            <div class="experiment-item">
                                <div>
                                    <div class="exp-round">第 ${exp.experiment_id} 轮</div>
                                </div>
                                <div>
                                    <span class="exp-score ${exp.score >= data.best_score ? 'best' : ''}">${exp.score.toFixed(1)}</span>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        list.innerHTML = '<div class="experiment-item">暂无数据</div>';
                    }
                });

            fetch('/api/stocks')
                .then(r => r.json())
                .then(data => {
                    const list = document.getElementById('stock-list');
                    if (data.stocks && data.stocks.length > 0) {
                        list.innerHTML = data.stocks.map(stock => `
                            <tr>
                                <td>${stock.code}</td>
                                <td>${stock.name}</td>
                                <td>${stock.close.toFixed(2)}</td>
                                <td>${stock.score.toFixed(0)}</td>
                                <td><span class="signal signal-${stock.signal.toLowerCase()}">${stock.signal}</span></td>
                                <td>${stock.momentum_5d.toFixed(1)}%</td>
                                <td>${stock.rsi.toFixed(0)}</td>
                            </tr>
                        `).join('');
                    } else {
                        list.innerHTML = '<tr><td colspan="7" style="text-align:center;">暂无数据</td></tr>';
                    }
                });
        }

        // 启动研究
        function startResearch() {
            fetch('/api/start-research', { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    alert(data.message);
                    refreshData();
                });
        }

        // 初始加载
        refreshData();

        // 每30秒自动刷新
        setInterval(refreshData, 30000);
    </script>
</body>
</html>
