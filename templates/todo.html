        * {

            padding: 0;
            box-sizing: border-box;
        }

            min-height: 100vh;
        }

        /* Header */
        .header {
            background: #16213e;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2d2d4a;
        }

        .header h1 {
            font-size: 20px;
            color: #fff;
        }

        .header-nav {
            display: flex;
            gap: 16px;
        }

        .header-nav a {
            color: #888;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .header-nav a:hover, .header-nav a.active {
            background: #2d2d4a;
            color: #fff;
        }

        /* Tabs */
        .tabs-container {
            background: #16213e;
            padding: 0 24px;
            border-bottom: 1px solid #2d2d4a;
            display: flex;
            gap: 4px;
            overflow-x: auto;
        }

        .tab {
            padding: 12px 20px;
            color: #888;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab:hover {
            color: #fff;
        }

        .tab.active {
            color: #4a9eff;
            border-bottom-color: #4a9eff;
        }

        /* Sprint Header */
        .sprint-header {
            background: linear-gradient(135deg, #1e3a5f 0%, #16213e 100%);
            padding: 24px;
            border-bottom: 1px solid #2d2d4a;
        }

        .sprint-title {
            font-size: 24px;
            color: #fff;
            margin-bottom: 8px;
        }

        .sprint-meta {
            display: flex;
            gap: 24px;
            font-size: 13px;
            color: #888;
        }

        .sprint-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sprint-status {
            background: #2d7a4f;
            color: #fff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
        }

        .sprint-status.planning {
            background: #4a6fa5;
        }

        /* Kanban Board */
        .kanban-container {
            display: flex;
            gap: 16px;
            padding: 24px;
            overflow-x: auto;
            min-height: calc(100vh - 200px);
        }

        .kanban-column {
            min-width: 320px;
            max-width: 320px;
            background: #1a1a2e;
            border-radius: 8px;
            border: 1px solid #2d2d4a;
            display: flex;
            flex-direction: column;
        }

        .column-header {
            padding: 16px;
            border-bottom: 1px solid #2d2d4a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .column-title {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .column-count {
            background: #2d2d4a;
            color: #888;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
        }

        .column-body {
            padding: 12px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Task Cards */
        .task-card {
            background: #16213e;
            border-radius: 6px;
            padding: 14px;
            border: 1px solid #2d2d4a;
            cursor: pointer;
            transition: all 0.2s;
        }

        .task-card:hover {
            border-color: #4a9eff;
            transform: translateY(-2px);
        }

        .task-type {
            font-size: 11px;
            color: #4a9eff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .task-title {
            font-size: 14px;
            color: #fff;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .task-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
        }

        .task-epic {
            background: #2d2d4a;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
        }

        .task-priority {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .task-priority.p1 { background: #e53935; }
        .task-priority.p2 { background: #fb8c00; }
        .task-priority.p3 { background: #4a9eff; }

        .task-status {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
        }

        .task-status.todo { background: #3d3d5c; color: #888; }
        .task-status.in-progress { background: #2d6a4f; color: #4ade80; }
        .task-status.done { background: #1e3a5f; color: #4a9eff; }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        /* Progress Bar */
        .progress-bar {
            height: 4px;
            background: #2d2d4a;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4a9eff, #6c5ce7);
            transition: width 0.3s;
        }

        /* Sprint Progress */
        .sprint-progress {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }

        .progress-text {
            font-size: 12px;
            color: #888;
            min-width: 60px;
        }

        /* Responsive */

            .kanban-container {
                flex-direction: column;
            }

            .kanban-column {
                min-width: 100%;
                max-width: 100%;
            }

        /* Loading */

            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #666;
        }

            content: '';
            width: 24px;
            height: 24px;
            border: 2px solid #2d2d4a;
            border-top-color: #4a9eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 12px;
        }

            to { transform: rotate(360deg); }
        }
    </style>

        // 渲染看板
        function renderKanban(filter = 'all') {
            const kanban = document.getElementById('kanban');
            const columns = {
                '待开始': [],
                '进行中': [],
                '已完成': []
            };

            // 筛选任务
            let filteredTasks = tasks;
            if (filter !== 'all') {
                filteredTasks = tasks.filter(t => t.epic === filter);
            }

            // 按状态分组
            filteredTasks.forEach(task => {
                if (task.status === 'todo') columns['待开始'].push(task);
                else if (task.status === 'in-progress') columns['进行中'].push(task);
                else if (task.status === 'done') columns['已完成'].push(task);
            });

            // 渲染列
            kanban.innerHTML = Object.entries(columns).map(([title, items]) => `
                <div class="kanban-column">
                    <div class="column-header">
                        <div class="column-title">
                            ${title}
                            <span class="column-count">${items.length}</span>
                        </div>
                    </div>
                    <div class="column-body">
                        ${items.length === 0 ? '<div class="empty-state">暂无任务</div>' : ''}
                        ${items.map(task => `
                            <div class="task-card" onclick="showTaskDetail('${task.id}')">
                                <div class="task-type">${task.id}</div>
                                <div class="task-title">${task.title}</div>
                                ${task.description ? `<div style="font-size: 12px; color: #666; margin-bottom: 8px;">${task.description}</div>` : ''}
                                <div class="task-meta">
                                    <span class="task-epic">${task.epicName}</span>
                                    <span class="task-priority ${task.priority}" title="${task.priority.toUpperCase()}"></span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            // 更新进度
            updateProgress(filteredTasks);
        }

        function updateProgress(taskList) {
            const total = taskList.length;
            const done = taskList.filter(t => t.status === 'done').length;
            const percent = total > 0 ? Math.round((done / total) * 100) : 0;

            document.getElementById('progress-fill').style.width = percent + '%';
            document.getElementById('progress-text').textContent = `${done} / ${total}`;
            document.getElementById('task-count').textContent = `共 ${total} 个任务`;
        }

        // 显示任务详情
        function showTaskDetail(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                alert(`任务: ${task.id}\n\n${task.title}\n\n${task.description || '无描述'}\n\n优先级: ${task.priority.toUpperCase()}\nEpic: ${task.epicName}`);
            }
        }

        // Tab 切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.filter;
                renderKanban(currentFilter);
            });
        });

        // 初始渲染
        renderKanban();
    </script>
</body>
</html>
